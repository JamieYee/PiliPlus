name: Build signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit to build
        required: true
        default: main
        type: string
      publish_release:
        description: Publish the signed IPA as a GitHub Release
        required: true
        default: true
        type: boolean
      release_tag:
        description: Optional Release tag (generated automatically when empty)
        required: false
        default: ""
        type: string
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write

concurrency:
  group: signed-ios-${{ github.event.inputs.upstream_ref || 'main' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: bggRGjQaUbCoE/PiliPlus

jobs:
  prepare:
    name: Resolve upstream version
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.metadata.outputs.upstream_sha }}
      upstream_short_sha: ${{ steps.metadata.outputs.upstream_short_sha }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      should_build: ${{ steps.metadata.outputs.should_build }}
      publish_release: ${{ steps.metadata.outputs.publish_release }}
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ github.event.inputs.upstream_ref || 'main' }}
          path: upstream
          fetch-depth: 1

      - name: Resolve build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ github.event.inputs.release_tag || '' }}
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish_release || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(git -C upstream rev-parse HEAD)"
          upstream_short_sha="${upstream_sha:0:7}"
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' upstream/pubspec.yaml | head -n 1)"

          if [ -z "$version" ]; then
            echo "::error::Unable to read the PiliPlus version from pubspec.yaml."
            exit 1
          fi

          release_tag="$REQUESTED_TAG"
          if [ -z "$release_tag" ]; then
            release_tag="ios-v${version}-${upstream_short_sha}"
          fi

          publish_release="$REQUESTED_PUBLISH"
          if [ "$EVENT_NAME" = "schedule" ]; then
            publish_release="true"
          fi

          encoded_tag="$(jq -rn --arg value "$release_tag" '$value | @uri')"
          release_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}")"

          should_build="true"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$release_status" = "200" ]; then
            should_build="false"
            echo "Release $release_tag already exists; no new scheduled build is needed."
          fi

          {
            echo "upstream_sha=$upstream_sha"
            echo "upstream_short_sha=$upstream_short_sha"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "should_build=$should_build"
            echo "publish_release=$publish_release"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign IPA
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: macos-26
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Prepare PiliPlus build metadata
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply upstream iOS patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Import signing certificate and provisioning profile
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          CONFIGURED_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          CONFIGURED_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        shell: bash
        run: |
          set -euo pipefail

          for required_name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!required_name:-}" ]; then
              echo "::error::Required Actions secret $required_name is not configured."
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/ios-signing-certificate.p12"
          profile_path="$RUNNER_TEMP/ios-signing-profile.mobileprovision"
          profile_plist_path="$RUNNER_TEMP/ios-signing-profile.plist"
          keychain_path="$RUNNER_TEMP/ios-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_CERT_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist_path"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist_path")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist_path")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$profile_plist_path")"
          profile_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist_path")"
          profile_bundle_pattern="${profile_app_identifier#*.}"

          bundle_id="$CONFIGURED_BUNDLE_ID"
          if [ -z "$bundle_id" ]; then
            if [[ "$profile_bundle_pattern" == *"*"* ]]; then
              echo "::error::IOS_BUNDLE_ID is required when the provisioning profile uses a wildcard App ID."
              exit 1
            fi
            bundle_id="$profile_bundle_pattern"
          fi

          case "$profile_bundle_pattern" in
            "*"|"${bundle_id}") ;;
            *"*")
              profile_prefix="${profile_bundle_pattern%\*}"
              if [[ "$bundle_id" != "$profile_prefix"* ]]; then
                echo "::error::IOS_BUNDLE_ID does not match the provisioning profile App ID."
                exit 1
              fi
              ;;
            *)
              echo "::error::IOS_BUNDLE_ID does not match the provisioning profile App ID."
              exit 1
              ;;
          esac

          case "$(printf '%s' "$CONFIGURED_EXPORT_METHOD" | tr '[:upper:]' '[:lower:]')" in
            ""|ad-hoc|adhoc|release-testing)
              export_method="release-testing"
              signing_identity="Apple Distribution"
              ;;
            development|debug|debugging)
              export_method="debugging"
              signing_identity="Apple Development"
              ;;
            app-store|app-store-connect|appstore)
              export_method="app-store-connect"
              signing_identity="Apple Distribution"
              ;;
            enterprise|validation)
              export_method="$(printf '%s' "$CONFIGURED_EXPORT_METHOD" | tr '[:upper:]' '[:lower:]')"
              signing_identity="Apple Distribution"
              ;;
            *)
              echo "::error::Unsupported IOS_EXPORT_METHOD. Use app-store-connect, release-testing, enterprise, debugging, or validation."
              exit 1
              ;;
          esac

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"

          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile_path="$profiles_directory/$profile_uuid.mobileprovision"
          mkdir -p "$profiles_directory"
          cp "$profile_path" "$installed_profile_path"

          {
            echo "IOS_BUNDLE_ID=$bundle_id"
            echo "IOS_EXPORT_METHOD=$export_method"
            echo "IOS_PROFILE_NAME=$profile_name"
            echo "IOS_PROFILE_UUID=$profile_uuid"
            echo "IOS_TEAM_ID=$team_id"
            echo "IOS_SIGNING_IDENTITY=$signing_identity"
            echo "IOS_INSTALLED_PROFILE_PATH=$installed_profile_path"
            echo "IOS_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Configure Xcode signing
        env:
          PROJECT_FILE: ios/Runner.xcodeproj/project.pbxproj
        shell: ruby {0}
        run: |
          path = ENV.fetch("PROJECT_FILE")
          bundle_id = ENV.fetch("IOS_BUNDLE_ID")
          team_id = ENV.fetch("IOS_TEAM_ID")
          profile_name = ENV.fetch("IOS_PROFILE_NAME")
          signing_identity = ENV.fetch("IOS_SIGNING_IDENTITY")

          content = File.read(path)
          content.gsub!(/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/, "PRODUCT_BUNDLE_IDENTIFIER = #{bundle_id};")
          content.gsub!(/DEVELOPMENT_TEAM = [^;]*;/) do
            "DEVELOPMENT_TEAM = #{team_id};\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"#{profile_name}\";"
          end
          content.gsub!(/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"[^\"]*\";/,
                        "\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"#{signing_identity}\";")
          File.write(path, content)

      - name: Create export options
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Clear dict" ios/ExportOptions.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :method string $IOS_EXPORT_METHOD" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $IOS_SIGNING_IDENTITY" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROFILE_NAME" ios/ExportOptions.plist

      - name: Build signed IPA
        shell: bash
        run: |
          set -euo pipefail
          flutter build ipa \
            --release \
            --dart-define-from-file=pili_release.json \
            --export-options-plist=ios/ExportOptions.plist

          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error::The signed IPA was not generated."
            exit 1
          fi

          output_name="PiliPlus_iOS_${{ needs.prepare.outputs.version }}_${{ needs.prepare.outputs.upstream_short_sha }}.ipa"
          cp "$ipa_path" "$output_name"
          echo "IPA_PATH=$output_name" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-iOS-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.upstream_short_sha }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ needs.prepare.outputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: PiliPlus iOS ${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.upstream_short_sha }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            Signed iOS build of [bggRGjQaUbCoE/PiliPlus](https://github.com/bggRGjQaUbCoE/PiliPlus).

            Upstream commit: https://github.com/bggRGjQaUbCoE/PiliPlus/commit/${{ needs.prepare.outputs.upstream_sha }}
          files: ${{ env.IPA_PATH }}

      - name: Remove temporary signing files
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" 2>/dev/null || true
          fi
          if [ -n "${IOS_INSTALLED_PROFILE_PATH:-}" ]; then
            rm -f "$IOS_INSTALLED_PROFILE_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/ios-signing-certificate.p12" \
            "$RUNNER_TEMP/ios-signing-profile.mobileprovision" \
            "$RUNNER_TEMP/ios-signing-profile.plist"
